name: Publish to Expo (EAS Update)

# Publishes the app JS bundle to Expo's servers so it can be opened on a phone
# in the Expo Go app — no computer or local dev server needed.
# Requires an Expo access token repo secret (EXPO_TOKEN or INSPECTIONAPP).
#
# The app is pinned to Expo SDK 54 — the version the user's Expo Go supports —
# and publishes to the EAS branch "sdk-54" that their phone already opens.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/home-inspection-app-gsd-ym2es2
    paths:
      - 'app/**'
      - '.github/workflows/eas-update.yml'

env:
  # Expo access token — the user's repo stores it under the name INSPECTIONAPP
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.INSPECTIONAPP }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Expo token is available
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::No Expo token. Add an EXPO_TOKEN (or INSPECTIONAPP) repo secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Link or create Expo project (idempotent)
        working-directory: app
        run: eas init --force --non-interactive

      - name: Publish update
        working-directory: app
        run: eas update --branch sdk-54 --message "${{ github.sha }}" --non-interactive

  # Full native iOS build + TestFlight submission. Runs only when the commit
  # message contains [build-ios] — OTA updates handle everything else.
  ios-build:
    if: contains(github.event.head_commit.message, '[build-ios]')
    runs-on: ubuntu-latest
    steps:
      - name: Check Apple private key secret is available
        run: |
          if [ -z "${{ secrets.ASC_API_KEY_P8 }}" ]; then
            echo "::error::Missing repo secret ASC_API_KEY_P8 (the -----BEGIN PRIVATE KEY----- block)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Write App Store Connect API key
        working-directory: app
        run: printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > asc-api-key.p8

      - name: Link Expo project and configure updates
        working-directory: app
        run: |
          eas init --force --non-interactive
          eas update:configure --non-interactive

      - name: Provision iOS signing (certificate + profile via ASC API)
        working-directory: app
        env:
          EXPO_ASC_API_KEY_PATH: ./asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || '22NVTQ2YV3' }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || '04d8baf4-88dd-48d7-b8cf-423d73fa9be5' }}
        run: |
          npm install --no-save jsonwebtoken@9
          node scripts/asc-credentials.mjs
          node scripts/asc-appid.mjs

      - name: Build and auto-submit to TestFlight
        working-directory: app
        env:
          EXPO_ASC_API_KEY_PATH: ./asc-api-key.p8
          # Key/Issuer/Team IDs are identifiers, not credentials — safe in the
          # workflow. Repo secrets of the same names override when present.
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || '22NVTQ2YV3' }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || '04d8baf4-88dd-48d7-b8cf-423d73fa9be5' }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '9M58GJ35HY' }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit

  # Print recent EAS build + submission status ([eas-status] in commit message).
  eas-status:
    if: contains(github.event.head_commit.message, '[eas-status]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - name: List recent builds
        working-directory: app
        run: |
          eas init --force --non-interactive
          eas build:list --platform ios --limit 3 --non-interactive || true

  # Submit an ALREADY-BUILT binary to TestFlight without spending a new build.
  # Runs when the commit message contains [submit-ios].
  ios-submit:
    if: contains(github.event.head_commit.message, '[submit-ios]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Write App Store Connect API key
        working-directory: app
        run: printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > asc-api-key.p8

      - name: Submit latest build to TestFlight
        working-directory: app
        env:
          EXPO_ASC_API_KEY_PATH: ./asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || '22NVTQ2YV3' }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || '04d8baf4-88dd-48d7-b8cf-423d73fa9be5' }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '9M58GJ35HY' }}
        run: |
          eas init --force --non-interactive
          npm install --no-save jsonwebtoken@9
          node scripts/asc-appid.mjs
          eas submit --platform ios --profile production --latest --non-interactive
