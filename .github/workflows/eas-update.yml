name: Publish to Expo (EAS Update)

# Publishes the app JS bundle to Expo's servers so it can be opened on a phone
# in the Expo Go app — no computer or local dev server needed.
# Requires an Expo access token repo secret (EXPO_TOKEN or INSPECTIONAPP).
#
# Publishes one update per Expo SDK (each on its own EAS branch, e.g. sdk-56)
# so whichever SDK the phone's Expo Go build supports, a compatible update
# exists. Once the working SDK is confirmed, the matrix can be trimmed.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/home-inspection-app-gsd-ym2es2
    paths:
      - 'app/**'
      - '.github/workflows/eas-update.yml'

env:
  # Expo access token — the user's repo stores it under the name INSPECTIONAPP
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.INSPECTIONAPP }}

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 54
            expo_spec: expo@sdk-54
          - sdk: 55
            expo_spec: expo@sdk-55
          - sdk: 56
            expo_spec: expo@sdk-56
          - sdk: 57
            expo_spec: expo@latest
    name: publish sdk-${{ matrix.sdk }}
    steps:
      - name: Check Expo token is available
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::No Expo token. Add an EXPO_TOKEN (or INSPECTIONAPP) repo secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies aligned to SDK ${{ matrix.sdk }}
        working-directory: app
        run: |
          npm config set legacy-peer-deps true
          rm -f package-lock.json
          npm install "${{ matrix.expo_spec }}"
          npx expo install --fix

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Link or create Expo project (idempotent)
        working-directory: app
        run: eas init --force --non-interactive

      - name: Publish update
        working-directory: app
        run: eas update --branch "sdk-${{ matrix.sdk }}" --message "SDK ${{ matrix.sdk }} · ${{ github.sha }}" --non-interactive

      - name: How to open it
        run: |
          echo "Published branch sdk-${{ matrix.sdk }}. In Expo Go: open the 'inspectpro' project" \
               "and pick the branch marked compatible."
