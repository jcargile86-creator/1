name: Publish to Expo (EAS Update)

# Publishes the app JS bundle to Expo's servers so it can be opened on a phone
# in the Expo Go app — no computer or local dev server needed.
# Requires the EXPO_TOKEN repository secret (expo.dev access token).

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/home-inspection-app-gsd-ym2es2
    paths:
      - 'app/**'
      - '.github/workflows/eas-update.yml'

env:
  # Expo access token — the user's repo stores it under the name INSPECTIONAPP
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.INSPECTIONAPP }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: List visible secret names (values never printed)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: echo "$SECRETS_JSON" | jq -r 'keys[]'

      - name: Check Expo token is available
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::No Expo token. Add an EXPO_TOKEN repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Link or create Expo project (idempotent)
        working-directory: app
        run: eas init --force --non-interactive

      - name: Publish update
        working-directory: app
        run: eas update --branch preview --message "${{ github.sha }}" --non-interactive

      - name: How to open it
        run: |
          echo "Published. On your phone: install 'Expo Go', sign in with the same Expo account," \
               "and open the 'inspectpro' project (branch: preview)."
